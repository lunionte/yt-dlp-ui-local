appId: com.ytdlp.gui
productName: "yt-dlp GUI"
copyright: "Copyright © 2026"

directories:
  output: "../release"
  buildResources: "resources"

files:
  - "dist/**/*"
  - from: "../backend/dist"
    to: "backend/dist"
  - from: "../frontend/dist"
    to: "frontend/dist"

extraResources:
  - from: "../tools-lock.json"
    to: "tools-lock.json"
  - from: "../yt-dlp.exe"
    to: "yt-dlp.exe"
  - from: "../ffmpeg.exe"
    to: "ffmpeg.exe"
  - from: "resources/icon.ico"
    to: "icon.ico"

win:
  target:
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico

portable:
  artifactName: "yt-dlp-GUI-Portable-${version}.exe"

npmRebuild: false
